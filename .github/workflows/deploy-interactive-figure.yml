name: Deploy interactive figure to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "figure_interactive/**"
      - ".github/workflows/deploy-interactive-figure.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload interactive figure
        uses: actions/upload-pages-artifact@v4
        with:
          path: figure_interactive
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
